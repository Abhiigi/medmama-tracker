<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedMama 🌸 Pregnancy Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --blush:#f7e8e8;--rose:#e8a0a0;--deep:#c0627a;
  --sage:#7aaa80;--softgreen:#d4ead6;
  --cream:#fdf8f4;--white:#fffaf7;--text:#3a2a30;--light:#9a7878;
  --shadow:0 4px 24px rgba(192,98,122,.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;padding-bottom:60px;}

/* ── AUTH SCREEN ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{background:#fff;border-radius:28px;padding:36px 28px;max-width:400px;width:100%;
  box-shadow:0 8px 40px rgba(192,98,122,.13);}
.auth-logo{font-family:'Playfair Display',serif;font-size:28px;color:var(--deep);font-style:italic;
  text-align:center;margin-bottom:4px;}
.auth-sub{text-align:center;font-size:13px;color:var(--light);margin-bottom:28px;}
.auth-tabs{display:flex;background:var(--blush);border-radius:14px;padding:4px;margin-bottom:24px;gap:4px;}
.auth-tab{flex:1;padding:8px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;
  font-family:'DM Sans',sans-serif;background:transparent;color:var(--light);transition:all .2s;}
.auth-tab.active{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(192,98,122,.12);}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--light);margin-bottom:5px;}
.auth-field input{width:100%;border:1.5px solid var(--blush);border-radius:12px;padding:11px 14px;
  font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border .2s;}
.auth-field input:focus{border-color:var(--rose);}
.auth-btn{width:100%;padding:13px;background:var(--deep);color:#fff;border:none;border-radius:14px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;transition:background .2s;}
.auth-btn:hover{background:#a84f68;}
.auth-btn:disabled{background:#ddd;cursor:not-allowed;}
.auth-err{background:#fff0f0;border:1px solid #f5c0c0;border-radius:10px;padding:10px 14px;
  font-size:12px;color:#c04040;margin-top:12px;display:none;}
.auth-ok{background:#f0fff4;border:1px solid #a0d4b0;border-radius:10px;padding:10px 14px;
  font-size:12px;color:#2a7040;margin-top:12px;display:none;}

/* ── TOP BAR ── */
.topbar{background:#fff;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--blush);position:sticky;top:0;z-index:20;}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--deep);font-style:italic;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.tabs{display:flex;gap:5px;}
.tab{padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:500;
  font-family:'DM Sans',sans-serif;transition:all .2s;}
.tab.active{background:var(--deep);color:#fff;}
.tab:not(.active){background:var(--blush);color:var(--light);}
.signout-btn{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:500;
  font-family:'DM Sans',sans-serif;background:#f5f0f0;color:var(--light);transition:all .2s;}
.signout-btn:hover{background:var(--blush);color:var(--deep);}

/* ── SYNC BAR ── */
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;padding:4px 12px;background:var(--blush);color:var(--deep);border-bottom:1px solid #f0dada;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.sync-dot.ok{background:#7aaa80;}
.sync-dot.err{background:#e07070;}
.sync-dot.loading{background:#f5c842;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── APP ── */
.body{max-width:500px;margin:0 auto;padding:20px 16px;}
.card{background:#fff;border-radius:20px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px;}
.date-row{display:flex;justify-content:space-between;align-items:center;}
.date-lbl{font-size:10px;color:var(--light);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.date-val{font-family:'Playfair Display',serif;font-size:17px;color:var(--text);font-weight:600;}
.today-badge{background:var(--blush);color:var(--deep);font-size:10px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;padding:3px 12px;border-radius:20px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prog-lbl{font-size:10px;color:var(--light);text-transform:uppercase;letter-spacing:1px;}
.prog-count{font-size:14px;font-weight:700;color:var(--deep);}
.prog-track{height:8px;background:var(--blush);border-radius:10px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--deep));border-radius:10px;transition:width .5s ease;}
.prog-times{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--light);}
.sec-label{display:flex;align-items:center;gap:8px;margin:18px 0 8px;
  font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--light);}
.sec-line{flex:1;height:1px;background:rgba(0,0,0,.07);}
.med-card{background:#fff;border-radius:18px;padding:13px 15px;margin-bottom:9px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;
  transition:all .2s;border-left:4px solid #e8d8d8;animation:fadeUp .35s ease both;}
.med-card.done{opacity:.8;}
.med-card.morning{border-left-color:#f5c842;} .med-card.morning.done{background:#fffef0;}
.med-card.noon   {border-left-color:#f5944a;} .med-card.noon.done   {background:#fff6f0;}
.med-card.evening{border-left-color:#7b8fdb;} .med-card.evening.done{background:#f4f6ff;}
.med-card.night  {border-left-color:#9b7fe8;} .med-card.night.done  {background:#f7f3ff;}
.med-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.morning .med-icon{background:#fff8e1;} .noon .med-icon{background:#fff0e6;}
.evening .med-icon{background:#f0f4ff;} .night .med-icon{background:#f0eaff;}
.med-info{flex:1;min-width:0;}
.med-brand{font-family:'Playfair Display',serif;font-size:14px;color:var(--deep);font-style:italic;}
.med-name{font-size:12px;color:var(--text);font-weight:500;margin-top:1px;}
.med-meta{font-size:10px;color:var(--light);margin-top:2px;}
.med-dose{display:inline-block;margin-top:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.morning .med-dose{background:#fff8e1;color:#7a5c00;} .noon .med-dose{background:#fff0e6;color:#7a3500;}
.evening .med-dose{background:#f0f4ff;color:#1a2870;} .night .med-dose{background:#f0eaff;color:#3a1a70;}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid #ddd;background:#fff;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;transition:all .2s;user-select:none;font-weight:700;}
.morning .chk.checked{background:#f5c842;border-color:#f5c842;} .noon .chk.checked{background:#f5944a;border-color:#f5944a;}
.evening .chk.checked{background:#7b8fdb;border-color:#7b8fdb;} .night .chk.checked{background:#9b7fe8;border-color:#9b7fe8;}
.notes-lbl{font-size:10px;color:var(--light);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
textarea{width:100%;border:none;outline:none;resize:none;font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);background:transparent;line-height:1.7;min-height:60px;}
textarea::placeholder{color:#c4b4b4;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--text);font-weight:600;}
.cal-btn{background:var(--blush);border:none;border-radius:10px;padding:6px 16px;cursor:pointer;font-size:18px;color:var(--deep);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px;}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--light);letter-spacing:1px;padding:4px 0;}
.cal-day{border-radius:10px;border:none;cursor:pointer;font-size:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 2px;aspect-ratio:1/1;transition:all .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.05);font-family:'DM Sans',sans-serif;}
.cal-day.empty-cell{background:transparent;box-shadow:none;cursor:default;}
.cal-day.future{background:#f9f5f5;color:#ccc;cursor:default;}
.cal-day.sel{background:var(--deep)!important;color:#fff!important;font-weight:700;box-shadow:0 2px 10px rgba(192,98,122,.35);}
.cal-day.today-cell{background:var(--blush);font-weight:700;}
.cal-day.full{background:var(--softgreen);color:#2a6a30;}
.cal-day.partial{background:#fff3cd;color:#7a5c00;}
.cal-day.none{background:#fff;}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px;}
.cal-day.full .cal-dot{background:#2a6a30;} .cal-day.partial .cal-dot{background:#f5c842;}
.cal-day.none .cal-dot,.cal-day.future .cal-dot{background:transparent;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--light);}
.leg-dot{width:10px;height:10px;border-radius:3px;}
.summary-line{font-size:13px;line-height:2.1;color:var(--text);}
.summary-line span{font-size:10px;color:var(--light);}
.view{display:none;} .view.active{display:block;}
#app{display:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<!-- ══ AUTH SCREEN ══ -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">🌸 MedMama</div>
    <div class="auth-sub">Your personal pregnancy medicine tracker</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input id="auth-email" type="email" placeholder="you@example.com"/>
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input id="auth-password" type="password" placeholder="••••••••"/>
    </div>
    <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">Sign In</button>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-ok" id="auth-ok"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="logo">🌸 MedMama</div>
    <div class="topbar-right">
      <div class="tabs">
        <button class="tab active" onclick="showView('today')">Today</button>
        <button class="tab" onclick="showView('calendar')">Calendar</button>
      </div>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text">Loading…</span>
  </div>
  <div class="body">
    <!-- TODAY VIEW -->
    <div id="view-today" class="view active">
      <div class="card" style="margin-bottom:14px;">
        <div class="date-row">
          <div>
            <div class="date-lbl">Date</div>
            <div class="date-val" id="date-display">—</div>
          </div>
          <div id="today-badge" class="today-badge" style="display:none">Today</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:18px;">
        <div class="prog-top">
          <span class="prog-lbl">Doses taken</span>
          <span class="prog-count" id="prog-count">0 / 6</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="prog-times"><span>🌅 Morning</span><span>🌞 Noon</span><span>🌇 Evening</span><span>🌃 Night</span></div>
      </div>
      <div id="med-sections"></div>
      <div class="sec-label">📝 Notes <div class="sec-line"></div></div>
      <div class="card">
        <div class="notes-lbl">How are you feeling today?</div>
        <textarea id="notes-input" placeholder="Write any symptoms, side effects, or reminders…" oninput="saveNote()"></textarea>
      </div>
    </div>
    <!-- CALENDAR VIEW -->
    <div id="view-calendar" class="view">
      <div class="card">
        <div class="cal-nav">
          <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
          <div class="cal-title" id="cal-title">—</div>
          <button class="cal-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="legend">
          <div class="leg-item"><div class="leg-dot" style="background:var(--softgreen)"></div>All doses</div>
          <div class="leg-item"><div class="leg-dot" style="background:#fff3cd"></div>Partial</div>
          <div class="leg-item"><div class="leg-dot" style="background:#f0f0f0"></div>Missed</div>
        </div>
      </div>
      <div class="card">
        <div class="summary-line" id="month-summary">Loading…</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = "https://pwzppkcdhzcidkpygklk.supabase.co";
const SUPABASE_KEY = "sb_publishable_t_dpnS302dfHmv3Y9ms1Qg_wpBvOrAT";
const REST = `${SUPABASE_URL}/rest/v1`;
const AUTH = `${SUPABASE_URL}/auth/v1`;

// ── MEDS ─────────────────────────────────────────────────────────────────────
const MEDS = [
  {id:"dsr",           brand:"DSR",            name:"Omeprazole + Domperidone", icon:"💊", time:"morning", timing:"Empty Stomach",   dose:"1 capsule"},
  {id:"ecosprin",      brand:"Ecosprin AV 75", name:"Aspirin + Atorvastatin",   icon:"❤️", time:"morning", timing:"After Breakfast", dose:"1 tablet"},
  {id:"susten",        brand:"Susten 200",      name:"Progesterone",             icon:"🌿", time:"noon",    timing:"After Lunch",     dose:"1 tablet"},
  {id:"dydrogesterone",brand:"Dydrogesterone",  name:"Progestogen",              icon:"🌸", time:"evening", timing:"After Dinner",    dose:"1 tablet"},
  {id:"zincovit",      brand:"Zincovit",        name:"Multivitamin & Zinc",      icon:"✨", time:"night",   timing:"After Dinner",    dose:"1 tablet"},
  {id:"folvite",       brand:"Folvite",         name:"Folic Acid",               icon:"🍃", time:"night",   timing:"After Dinner",    dose:"1 tablet"},
];
const SECTIONS=[
  {key:"morning",label:"Morning", emoji:"🌅",sub:"Before Breakfast"},
  {key:"noon",   label:"Noon",    emoji:"🌞",sub:"Before / After Lunch"},
  {key:"evening",label:"Evening", emoji:"🌇",sub:"After Dinner"},
  {key:"night",  label:"Night",   emoji:"🌃",sub:"After Dinner"},
];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentUser=null, accessToken=null;
let selectedDate=toKey(new Date());
let calYear,calMonth;
let cache={},noteTimer=null,authMode='login';
(function(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();})();

function toKey(d){return d.toISOString().slice(0,10);}
function todayKey(){return toKey(new Date());}

// ── AUTH UI ───────────────────────────────────────────────────────────────────
function switchAuthTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&mode==='login')||(i===1&&mode==='signup'));
  });
  document.getElementById('auth-submit-btn').textContent=mode==='login'?'Sign In':'Create Account';
  document.getElementById('auth-err').style.display='none';
  document.getElementById('auth-ok').style.display='none';
}
function showAuthError(msg){
  const el=document.getElementById('auth-err');
  el.textContent=msg;el.style.display='block';
  document.getElementById('auth-ok').style.display='none';
}
function showAuthOk(msg){
  const el=document.getElementById('auth-ok');
  el.textContent=msg;el.style.display='block';
  document.getElementById('auth-err').style.display='none';
}

async function handleAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const btn=document.getElementById('auth-submit-btn');
  if(!email||!password){showAuthError('Please enter your email and password.');return;}
  btn.disabled=true;
  btn.textContent=authMode==='login'?'Signing in…':'Creating account…';
  document.getElementById('auth-err').style.display='none';
  document.getElementById('auth-ok').style.display='none';
  try{
    const endpoint=authMode==='login'?'/token?grant_type=password':'/signup';
    const res=await fetch(`${AUTH}${endpoint}`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
      body:JSON.stringify({email,password})
    });
    const data=await res.json();
    if(!res.ok){
      showAuthError(data.error_description||data.msg||'Authentication failed.');
      btn.disabled=false;btn.textContent=authMode==='login'?'Sign In':'Create Account';
      return;
    }
    if(authMode==='signup'&&!data.access_token){
      showAuthOk('✅ Account created! Check your email to confirm, then sign in.');
      btn.disabled=false;btn.textContent='Create Account';
      return;
    }
    accessToken=data.access_token;
    currentUser=data.user;
    cache={};
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='block';
    setSyncStatus('ok',`Signed in as ${currentUser.email}`);
    renderToday();
  }catch(e){
    showAuthError('Network error. Please try again.');
    btn.disabled=false;btn.textContent=authMode==='login'?'Sign In':'Create Account';
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none') handleAuth();
});

async function signOut(){
  try{await fetch(`${AUTH}/logout`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${accessToken}`}});}catch(e){}
  accessToken=null;currentUser=null;cache={};
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('auth-email').value='';
  document.getElementById('auth-password').value='';
  document.getElementById('auth-err').style.display='none';
  document.getElementById('auth-ok').style.display='none';
  switchAuthTab('login');
}

// ── SYNC STATUS ───────────────────────────────────────────────────────────────
function setSyncStatus(state,msg){
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-text').textContent=msg;
}

// ── SUPABASE API ──────────────────────────────────────────────────────────────
function authHeaders(){
  return{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${accessToken}`,'Prefer':'return=representation'};
}
async function sbFetch(path,options={}){
  const res=await fetch(`${REST}${path}`,{headers:authHeaders(),...options});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const t=await res.text();return t?JSON.parse(t):null;
}

async function loadDayFromDB(dateKey){
  if(cache[dateKey]) return cache[dateKey];
  try{
    const rows=await sbFetch(`/medmama_tracker?date=eq.${dateKey}&user_id=eq.${currentUser.id}&select=*`);
    cache[dateKey]=(rows&&rows.length>0)?{checks:rows[0].checks||{},note:rows[0].note||""}:{checks:{},note:""};
    return cache[dateKey];
  }catch(e){setSyncStatus('err','Sync error');return{checks:{},note:""};}
}

async function saveDayToDB(dateKey,data){
  setSyncStatus('loading','Saving…');
  try{
    await sbFetch(`/medmama_tracker`,{
      method:'POST',
      headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({date:dateKey,user_id:currentUser.id,checks:data.checks,note:data.note})
    });
    cache[dateKey]=data;
    setSyncStatus('ok','Synced ✓');
  }catch(e){setSyncStatus('err','Save failed');console.error(e);}
}

// ── VIEWS ─────────────────────────────────────────────────────────────────────
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(el=>{if(el.textContent.toLowerCase()===v)el.classList.add('active');});
  if(v==='today') renderToday();
  if(v==='calendar') renderCalendar();
}

// ── TODAY ─────────────────────────────────────────────────────────────────────
async function renderToday(){
  setSyncStatus('loading','Loading…');
  const dayData=await loadDayFromDB(selectedDate);
  setSyncStatus('ok','Synced ✓');
  const isToday=selectedDate===todayKey();
  const d=new Date(selectedDate+"T00:00:00");
  document.getElementById('date-display').textContent=
    d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('today-badge').style.display=isToday?'':'none';
  const checked=MEDS.filter(m=>dayData.checks[m.id]).length;
  const pct=Math.round(checked/MEDS.length*100);
  document.getElementById('prog-count').textContent=`${checked} / ${MEDS.length} · ${pct}%`;
  document.getElementById('prog-fill').style.width=pct+'%';
  const container=document.getElementById('med-sections');
  container.innerHTML='';
  SECTIONS.forEach(sec=>{
    const meds=MEDS.filter(m=>m.time===sec.key);
    if(!meds.length) return;
    const lbl=document.createElement('div');
    lbl.className='sec-label';
    lbl.innerHTML=`${sec.emoji} ${sec.label} <span style="font-weight:300;text-transform:none;letter-spacing:0">— ${sec.sub}</span><div class="sec-line"></div>`;
    container.appendChild(lbl);
    meds.forEach(med=>{
      const done=!!dayData.checks[med.id];
      const card=document.createElement('div');
      card.className=`med-card ${med.time} ${done?'done':''}`;
      card.innerHTML=`
        <div class="med-icon">${med.icon}</div>
        <div class="med-info">
          <div class="med-brand">${med.brand}</div>
          <div class="med-name">${med.name}</div>
          <div class="med-meta">${med.timing}</div>
          <div class="med-dose">${med.dose}</div>
        </div>
        <div class="chk ${done?'checked':''}" onclick="toggleCheck('${med.id}')">${done?'✓':''}</div>`;
      container.appendChild(card);
    });
  });
  document.getElementById('notes-input').value=dayData.note||'';
}

async function toggleCheck(medId){
  const dayData=await loadDayFromDB(selectedDate);
  dayData.checks[medId]=!dayData.checks[medId];
  cache[selectedDate]=dayData;
  await saveDayToDB(selectedDate,dayData);
  renderToday();
}

function saveNote(){
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer=setTimeout(async()=>{
    const dayData=await loadDayFromDB(selectedDate);
    dayData.note=document.getElementById('notes-input').value;
    cache[selectedDate]=dayData;
    await saveDayToDB(selectedDate,dayData);
  },800);
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
async function getDayStatus(dateStr){
  const d=await loadDayFromDB(dateStr);
  const count=MEDS.filter(m=>d.checks[m.id]).length;
  if(count===0) return 'none';
  if(count===MEDS.length) return 'full';
  return 'partial';
}

async function renderCalendar(){
  document.getElementById('cal-title').textContent=`${MONTHS[calMonth]} ${calYear}`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);
  });
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=todayKey();
  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='cal-day empty-cell';grid.appendChild(el);}
  try{
    const m=String(calMonth+1).padStart(2,'0');
    const rows=await sbFetch(`/medmama_tracker?date=gte.${calYear}-${m}-01&date=lte.${calYear}-${m}-${String(daysInMonth).padStart(2,'0')}&user_id=eq.${currentUser.id}&select=*`);
    if(rows) rows.forEach(r=>{cache[r.date]={checks:r.checks||{},note:r.note||""};});
  }catch(e){}
  let full=0,partial=0,empty=0;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isFuture=ds>today,isToday=ds===today,isSel=ds===selectedDate;
    const status=isFuture?'future':await getDayStatus(ds);
    if(!isFuture){if(status==='full')full++;else if(status==='partial')partial++;else empty++;}
    const el=document.createElement('button');
    el.className=`cal-day ${isFuture?'future':status} ${isToday&&!isSel?'today-cell':''} ${isSel?'sel':''}`;
    el.innerHTML=`${day}<div class="cal-dot"></div>`;
    if(!isFuture) el.onclick=()=>{selectedDate=ds;showView('today');};
    grid.appendChild(el);
  }
  const total=full+partial+empty;
  document.getElementById('month-summary').innerHTML=
    `✅ All doses taken: <strong>${full}</strong> day${full!==1?'s':''}<br>
     🟡 Partial: <strong>${partial}</strong> day${partial!==1?'s':''}<br>
     ⬜ Missed: <strong>${empty}</strong> day${empty!==1?'s':''}<br>
     <span>Out of ${total} tracked day${total!==1?'s':''} this month</span>`;
  setSyncStatus('ok','Synced ✓');
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
</script>
